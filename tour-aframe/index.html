      <!-- Componente di navigazione AUTOMATICO -->
     <!-- Componente di navigazione AUTOMATICO -->
      <script>
        // Registriamo un componente per gli hotspot che memorizza i suoi dati di navigazione
        AFRAME.registerComponent('hotspot-item', {
          schema: {
            stanza: { type: 'string' },
            rotazione: { type: 'string', default: '0 0 0' },
            mostra: { type: 'string' }
          }
        });

        AFRAME.registerComponent('navigatore', {
          init: function () {
            const el = this.el;
            
            el.addEventListener('click', () => {
              // Recupera i dati dal componente hotspot-item associato allo stesso cerchio
              const data = el.components['hotspot-item'] ? el.components['hotspot-item'].data : null;
              if (!data) return;

              const skyEl = document.querySelector('#sfondo-principale');
              
              console.log("Cambio stanza verso: " + data.stanza);
              
              // 1. Cambia l'immagine di sfondo
              skyEl.setAttribute('src', '#' + data.stanza);
              
              // 2. Applica la rotazione se specificata
              if (data.rotazione && data.rotazione !== '0 0 0') {
                skyEl.setAttribute('rotation', data.rotazione);
              }

              // 3. SPEGNIMENTO TOTALE: Spegne TUTTI i gruppi, nasconde i cerchi E rimuove l'attributo 'navigatore' da TUTTI i cerchi della scena
              document.querySelectorAll('a-entity[id^="gruppo-"]').forEach(group => {
                group.setAttribute('visible', 'false');
                group.querySelectorAll('a-circle').forEach(circle => {
                  circle.setAttribute('visible', 'false');
                  circle.removeAttribute('navigatore'); // BLINDATURA: Diventano invisibili al raycaster del mouse!
                });
              });

              // 4. ACCENSIONE SELETTIVA: Accende SOLO il gruppo richiesto e riattiva il navigatore sui suoi cerchi
              if (data.mostra) {
                const targetEl = document.querySelector('#' + data.mostra.trim());
                if (targetEl) {
                  targetEl.setAttribute('visible', 'true');
                  
                  // Riattiva visibilità e attributo 'navigatore' SOLO per i cerchi del gruppo attivo
                  targetEl.querySelectorAll('a-circle').forEach(circle => {
                    circle.setAttribute('visible', 'true');
                    circle.setAttribute('navigatore', ''); // Riabilita il raycaster solo qui!
                  });
                }
              }
            });
          }
        });
      </script>

      <a-sky id="sfondo-principale" src="img/N_ingresso.jpg" rotation="0 170 0"></a-sky>

      <a-camera look-controls="reverseMouseDrag: true">
        <a-cursor color="#FF0000" fuse="false" cursor="rayOrigin: mouse" opacity="0" raycaster="objects: [navigatore]"></a-cursor>
      </a-camera>

<!--L'attributo position serve a posizionare l'hotspot (pallino)
attorno alla telecamera, che si trova idealmente al centro delle coordinate 0 1.5 0
x -- negativi spostano l'oggetto verso la sinistra dello schermo
     positivi spostano l'oggetto verso la destra dello schermo
y--  su/giù 1.5 posiziona l'hotspot più o meno all'altezza degli occhi
     2 alza il pallino
	 1 abbassa il pallino verso il pavimento
z--  Regola la distanza in avanti o all'indietro rispetto alla visuale iniziale
     negativi mettono l'oggetto davanti
	 positivi mettono l'oggetto dietro

L'attributo rotation serve a inclinare, girare o orientare il pallino
rotation="0 180 0"	significa ruota l'oggetto di 180 gradi in orizzontale per farlo guardare dalla parte opposta

La rotazione scritta dentro l'attributo navigatore ruota l'intera immagine a 360 gradi dello sfondo 
(a-sky) nel momento esatto in cui si clicca sul pallino e si cambia stanza

Ogni gruppo ha visibilità FALSE, quando entro in quel gruppo rendo visibile il singolo gruppo
altrimenti restano attivi hotspot già visitati
-->
